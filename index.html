// ═══ 网格点 ═══
(function(){
  const g=document.getElementById('dotGrid');
  const cols=32,rows=20,size=2,gap=100/cols;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const d=document.createElement('div');
      d.className='dot';
      d.style.cssText=`width:${size}px;height:${size}px;left:${(c+.5)*gap}%;top:${(r+.5)*(100/rows)}%;opacity:0;transform:scale(0)`;
      g.appendChild(d);
    }
  }
  anime({
    targets:'.dot',
    opacity:[0,.1],scale:[0,1],
    easing:'easeOutQuad',
    duration:400,
    delay:anime.stagger(15,{grid:[rows,cols],from:'center'}),
  });
})();

// ═══ SVG 面 ═══
const faceG=document.getElementById('faces');
DATA.faces.forEach(d=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('class','face');
  p.style.opacity='0';
  faceG.appendChild(p);
});

// ═══ SVG 线 ═══
const lineG=document.getElementById('lines');
const lineEls=[];
DATA.svg.forEach((d,i)=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('class','line');
  const len=p.getTotalLength();
  p.style.strokeDasharray=len;
  p.style.strokeDashoffset=len;
  lineG.appendChild(p);

},200);

const done=400+lineEls.length*80+1600+600;

  setTimeout(()=>document.getElementById('loader').style.display='none',600);

  let ry=-.35,rx=-.25,try_=-.35,trx=-.25,zm=1,tzm=1;
